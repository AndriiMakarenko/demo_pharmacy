[project]
name = "pharmacy"
version = "0.1.0"
description = "Pharmacy task manager demo"
authors = [
    {name = "Andrii Makarenko",email = "andriimakarenko@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard] (>=0.115.14,<0.116.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
run-agents = "scripts.run_agents:main"
run-task-creator = "scripts.run_task_creator:main"
